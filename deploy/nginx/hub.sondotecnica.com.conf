# nginx do HOST (o mesmo que já atende o outro projeto da VM).
# Só faz duas coisas: HTTPS (o certbot acrescenta o bloco 443 sozinho) e repassar tudo para o container do hub.
# Vai em /etc/nginx/sites-available/ (veja o passo B6 do deploy/README.md).
# WebSocket do assistente (/api/assistente/voz): sem isto o nginx derruba o Upgrade.
# Nome próprio ($hub_...) para não colidir com outro "map" do mesmo host.
map $http_upgrade $hub_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name hub.sondotecnica.com;

    client_max_body_size 3m;

    location / {
        proxy_pass http://127.0.0.1:2020;
        proxy_set_header Host $host;
        # Este é o primeiro proxy: ele SOBRESCREVE o X-Forwarded-For com o IP real,
        # então um cliente não consegue mandar um IP falso no header.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket do assistente: o Upgrade passa e a conversa de voz pode durar horas.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $hub_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
