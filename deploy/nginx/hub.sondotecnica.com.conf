# nginx do HOST (o mesmo que já atende o outro projeto da VM).
# Só faz duas coisas: HTTPS (o certbot acrescenta o bloco 443 sozinho) e repassar tudo para o container do hub.
# Vai em /etc/nginx/sites-available/ (veja o passo B6 do deploy/README.md).
server {
    listen 80;
    server_name hub.sondotecnica.com;

    client_max_body_size 3m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        # Este é o primeiro proxy: ele SOBRESCREVE o X-Forwarded-For com o IP real,
        # então um cliente não consegue mandar um IP falso no header.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
