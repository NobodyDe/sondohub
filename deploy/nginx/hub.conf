# nginx DENTRO do container do hub. Faz o papel do proxy do Vite no dev:
# front e API no mesmo origin, então o cookie de sessão é first-party e o hub não precisa de CORS.
server {
    listen 80;
    root /usr/share/nginx/html;

    # O avatar chega com até 2 MB na API (o padrão do nginx é 1 MB).
    client_max_body_size 3m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # O Docker tem um DNS interno (127.0.0.11). Com o endereço numa variável, o nginx resolve "api"
    # a cada 10 s em vez de só ao subir: recriar só o container da api (IP novo) não derruba o hub com 502.
    resolver 127.0.0.11 valid=10s;
    set $api http://api:3100;

    location /api/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # O Vite põe um hash no nome de cada arquivo de /assets: o conteúdo nunca muda, então pode ficar 1 ano em cache.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA: /admin/usuarios não existe como arquivo, então toda rota do React Router cai no index.html.
    # O index.html nunca fica em cache: é ele que aponta para os assets novos depois de um deploy.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
